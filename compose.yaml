services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estetica
      POSTGRES_USER: estetica_dev
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - estetica-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estetica_dev -d estetica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estetica-postgres:
